<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>野球盤甲子園</title>
<meta name="robots" content="noindex,nofollow">
<style>
/* レイアウト＝上にスコア、中央に野球盤そのもの、下にレバーとボタン（おもちゃの操作盤） */
:root{color-scheme:dark;--bg:#2a1a10;--wood:#5a3418;--panel:#1d120a;--ink:#fbf6ea;--sub:#d8c7ae;--red:#d8332a;--blue:#2d6fd2;--yellow:#f2c230;--green:#2f8a46;--gold:#e8a33d;--line:#7a5233}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
#app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:10px 28px}
h1{font-size:20px;margin:6px 0 2px}
.sub{color:var(--sub);font-size:13px;line-height:1.6}
.lab{font-size:12px;color:var(--sub);margin:10px 0 4px;letter-spacing:.05em}
button{font:inherit;color:var(--ink);background:#3a2616;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;cursor:pointer;min-height:44px}
button:disabled{opacity:.35}
button.on{border-color:var(--yellow);background:#5a4012}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
/* おもちゃのボタン */
.toy{border-radius:50%;width:84px;height:84px;font-weight:bold;font-size:15px;border:4px solid #0006;box-shadow:inset 0 -6px 0 #0004,0 4px 0 #0008}
.toy:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 #0004,0 1px 0 #0008}
.toy.red{background:var(--red)}.toy.blue{background:var(--blue)}.toy.yel{background:var(--yellow);color:#222}
.bigbat{width:100%;height:76px;border-radius:40px;font-size:24px;font-weight:bold;background:var(--red);border:4px solid #0006;box-shadow:inset 0 -6px 0 #0004,0 4px 0 #0008}
.knob{display:flex;gap:0;border-radius:12px;overflow:hidden;border:2px solid var(--line)}
.knob button{border:0;border-radius:0;flex:1;min-width:0;padding:8px 0;background:#3a2616}
.knobs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.knobs .lab{margin-top:4px}
.knob button.on{background:var(--yellow);color:#222;font-weight:bold}
.ctl{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.ctlcol{min-width:0}
#board{display:block;width:100%;border-radius:14px;background:#000;touch-action:none}
.bigbat,#board,.batrow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#sb{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:12px;padding:6px 10px;margin-bottom:6px;font-size:14px;flex-wrap:wrap}
.ls{display:grid;grid-template-columns:62px repeat(3,22px) 30px;gap:2px;text-align:center;font-variant-numeric:tabular-nums}
.ls .h{color:var(--sub);font-size:11px}.ls .tm{text-align:left}
.cnt{display:grid;grid-template-columns:14px auto;gap:2px 6px;font-size:12px;align-items:center}
.dots span{display:inline-block;width:11px;height:11px;border-radius:50%;background:#444;margin-right:3px}
.dots .g{background:#5fd068}.dots .y{background:#f2c94c}.dots .r{background:#e0574f}
.now{font-size:12px;line-height:1.5;min-width:0}
#log{background:var(--panel);border-radius:12px;padding:8px 10px;margin-top:8px;font-size:13px;line-height:1.6;max-height:130px;overflow:auto}
#log div:first-child{color:var(--yellow);font-weight:bold}
/* ラインナップ */
.order{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:4px;text-align:center;font-size:11px;cursor:pointer;min-width:0}
.slot.sel{border-color:var(--yellow)}
.slot>div,.slot img,.card img{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid #fff;display:block;background:#fff}
.slot b{display:block;font-size:12px;color:var(--yellow)}
.roster{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.roster .card{display:grid;grid-template-columns:44px 1fr;gap:2px 8px;align-items:center}.roster .card img,.roster .card .lockface{width:44px;grid-row:span 3}.roster .card .nm{margin-top:0}
.card{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px;font-size:11px;line-height:1.35;cursor:pointer;min-width:0}
.card.used{opacity:.45}
.card.lock{border-style:dashed;cursor:default}
.card .nm{font-weight:bold;font-size:12px;margin-top:4px;overflow-wrap:anywhere}
.card .sk{color:var(--yellow)}
.lockface{width:100%;aspect-ratio:1;border-radius:50%;border:3px dashed var(--sub);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--sub)}
.go{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.go button{min-height:64px;font-size:16px;font-weight:bold}
.go .auto{background:var(--blue)}.go .man{background:var(--red)}
.opp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opp .card{display:flex;flex-direction:column;align-items:center;text-align:center}
.opp .card img{width:56px}
.res{background:var(--panel);border-radius:12px;padding:14px;margin-top:10px;line-height:1.8}
.res h2{margin:0 0 6px;font-size:20px}
.box{display:grid;grid-template-columns:1fr 40px 40px;gap:2px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.box .h{color:var(--sub)}
.rk{display:grid;grid-template-columns:24px 1fr 60px;gap:2px 6px;font-size:13px}
.rk .me{color:var(--yellow);font-weight:bold}
@media (max-width:480px){.roster{grid-template-columns:repeat(2,1fr)}.toy{width:72px;height:72px;font-size:13px}}
@media (prefers-reduced-motion:reduce){.toy:active{transform:none}}
/* 試合画面：1画面に収める */
body.playing{overflow:hidden}
body.playing,body.playing *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app.game{max-width:none;height:100vh;height:100dvh;padding:8px 12px;display:grid;gap:8px;grid-template-columns:100%;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"sb" "board" "ctrl"}
#app.game #sb{grid-area:sb;margin:0;padding:4px 8px;font-size:13px}
#app.game #boardwrap{grid-area:board;min-height:0;display:flex;align-items:center;justify-content:center}
#app.game #ctrl{grid-area:ctrl;margin:0}
#app.game #log{display:none}
#app.game #ctrl .lab{margin:2px 0 2px}
@media (min-aspect-ratio:1/1) and (min-width:700px){
 #app.game{grid-template-columns:minmax(0,1fr) minmax(300px,380px);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"board sb" "board ctrl" "board log"}
 #app.game #log{display:block;grid-area:log;max-height:none;overflow:auto;margin:0}
}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:end}
.pgrid .span2{grid-column:1/-1}
.throw{min-height:56px;font-size:20px;font-weight:bold;background:var(--red);border:4px solid #0006;border-radius:28px;box-shadow:inset 0 -5px 0 #0004}
.batrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.batrow .bigbat{height:64px}
.mini{min-height:36px;padding:4px 10px;font-size:13px}
#app.game .toy{width:64px;height:64px;font-size:13px}
#resbox:empty{display:none}
#app.game #resbox{position:fixed;inset:4vh 4vw;overflow:auto;z-index:5;box-shadow:0 10px 40px #000a;border-radius:14px}
#app.game #resbox .res{margin:0;min-height:100%}
</style>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// ---------------- claude.ai の外で対戦する（PeerJS でブラウザ同士を直接つなぐ） ----------------
// net_v4.js が使う「部屋」（join → presence / onPeers / peers / connected / onConnection / leave）と同じ形を、PeerJS で作る。
// 部屋を作る側は合言葉から決まる名前で待ち、入る側はその名前へつなぐ。やり取りは「自分の状態」の丸ごとの送り合いだけ。
(function(){
 const PFX='ykbq7-';
 function mkRoom(name){
  const code=name.replace(/^ykb-/,'');
  const host=NET.role==='host';
  let me={}, opp=null, conn=null, peer=null, okConn=false, sendT=0, pend=false;
  const peersCb=[], connCb=[];
  const list=()=>{ const a=[{peer:'me',sameTab:true,isMe:true,presence:me}]; if(opp)a.push({peer:'opp',sameTab:false,isMe:false,presence:opp}); return a; };
  const firePeers=()=>{ const ps=list(); peersCb.forEach(f=>{try{f({peers:ps,joined:[],left:[],updated:[]});}catch(e){}}); };
  const fireConn=()=>connCb.forEach(f=>{try{f(okConn);}catch(e){}});
  const flush=()=>{ pend=false; sendT=performance.now(); if(conn&&conn.open){ try{conn.send(me);}catch(e){} } };
  const send=()=>{ if(pend)return; const w=33-(performance.now()-sendT); if(w<=0)flush(); else {pend=true;setTimeout(flush,w);} };
  const wire=c=>{
   conn=c;
   c.on('open',()=>{ okConn=true; fireConn(); flush(); });
   c.on('data',d=>{ if(d&&typeof d==='object'){ opp=d; firePeers(); } });
   c.on('close',()=>{ okConn=false; opp=null; fireConn(); firePeers(); });
   c.on('error',()=>{});
  };
  return new Promise((res,rej)=>{
   let done=false;
   const fail=code=>{ if(done)return; done=true; try{peer&&peer.destroy();}catch(e){} rej({code}); };
   peer=host?new Peer(PFX+code.toLowerCase()):new Peer();
   peer.on('error',e=>{ const t=e&&e.type||'error';
    if(!done)return fail(t==='unavailable-id'?'合言葉が使用中':t==='peer-unavailable'?'その合言葉の部屋がありません':t==='network'||t==='server-error'||t==='socket-error'?'つなぎ役のサーバーに届きません':t);
    if(t==='peer-unavailable'&&!host){ st2('その合言葉の部屋がありません。合言葉を確かめてください'); }
   });
   peer.on('open',()=>{
    if(host){ peer.on('connection',c=>{ if(conn&&conn.open){c.close();return;} wire(c); }); }
    else { wire(peer.connect(PFX+code.toLowerCase(),{reliable:true})); }
    done=true;
    res({
     presence:async patch=>{ for(const k in patch){ if(patch[k]===null)delete me[k]; else me[k]=patch[k]; } me=Object.assign({},me); send(); },
     onPeers:(f)=>{ peersCb.push(f); setTimeout(()=>f({peers:list(),joined:[],left:[],updated:[]}),0); return ()=>{}; },
     onConnection:(f)=>{ connCb.push(f); setTimeout(()=>f(okConn),0); return ()=>{}; },
     peers:()=>list(),
     connected:()=>okConn,
     leave:async()=>{ try{conn&&conn.close();}catch(e){} try{peer.destroy();}catch(e){} }
    });
   });
   setTimeout(()=>fail('つなぎ役のサーバーから返事がありません'),12000);
  });
 }
 function st2(t){ const el=document.getElementById('nst'); if(el)el.textContent=t; }
 window.YKB_P2P={ join:mkRoom };
})();

</script>
<script>
// ====================================================================
// 野球盤甲子園 モックv3（2026-10-01）
// 方針（西P 10/1）＝リアル野球盤をデジタルで操作している感覚。3Dのキャラは出さない。
//   画面は野球盤の盤面1枚。選手は人形（ステッカーを貼ったコマ）。球は鉄球。
//   テンポよく。オートモード＝ラインナップだけ決めて任せる。コラボキャラをステッカーとして入れて遊ぶ。
// step(dt) はグローバル（rAFが止まる環境では外から回して検証する）
// ====================================================================
const R=()=>Math.random();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const gauss=()=>{let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const pick=a=>a[Math.floor(R()*a.length)];
const sum=a=>a.reduce((x,y)=>x+y,0);

// ---------------- 画像（ステッカー） ----------------
const IMG={};
function img(k){ if(!IMG[k]){const im=new Image(); im.src='img/'+k+'.jpg'; IMG[k]=im;} return IMG[k]; }
const imgOk=im=>im&&im.complete&&im.naturalWidth>0;

// ---------------- 特徴（90年代のゲームのように、ざっくり1人1つ） ----------------
// 打者の特徴は「盤面」が変わって見える。投手の特徴は「球」が変わって見える
const BTYPE={
 power:{lab:'パワー',ic:'力',col:'#e8453a',txt:'ホームランゾーンが広がる',m:3,p:5,s:2},
 meet: {lab:'ミート',ic:'芯',col:'#2f9be0',txt:'アウトの穴が小さくなる',m:5,p:2,s:3},
 speed:{lab:'俊足',ic:'足',col:'#3fbf5f',txt:'内野で止まってもセーフ',m:4,p:2,s:5},
 normal:{lab:'ふつう',ic:'',col:'#888',txt:'',m:3,p:3,s:3}
};
const PTYPE={
 fast: {lab:'剛速球',ic:'速',col:'#ff5d3a',txt:'とにかく速い'},
 curve:{lab:'くねくね',ic:'曲',col:'#b05ce0',txt:'蛇行して大きく曲がる'},
 magic:{lab:'魔球',ic:'魔',col:'#3a7bff',txt:'消える魔球の名手'},
 normal:{lab:'ふつう',ic:'',col:'#888',txt:''}
};
// 2つ目の特徴の候補（打順の並び＝TEAMSのlineの順。nullは1つだけ）と、投手の特徴の候補
const CAND2={mlb:['meet',null,'meet','speed',null,'speed',null,null,'power'],taka:['meet',null,'speed','meet',null,'power',null,'speed','power'],
 mars:[null,'power','speed',null,null,null,null,null,null],jupiter:[null,null,'meet',null,null,null,'speed',null,null],venus:['meet',null,null,null,'speed',null,null,null,null]};
const PCAND={mlb:[['fast'],['curve','fast']],taka:[['magic','curve'],['curve','magic']],mars:[['magic','fast']],jupiter:[['fast','curve']],venus:[['curve','magic']]};
// 選手＝[名前, 打者の特徴, ステッカー]。ステッカーは画像（img/*.jpg）か、1文字のシール（g:字）
const TEAMS={
 mlb:{key:'mlb',name:'MLBチーム',short:'MLB',col:'#1f5bc4',mine:true,desc:'長打と剛速球。パワーで押す',
  line:[['吉田 コウタ','speed','y4'],['吉田 課長','meet','y2'],['キャプテン吉田','power','y5'],['吉田 剛','power','y1'],['吉田 山','power','y6'],['吉田 ミク','meet','y7'],['吉田 ナース','normal','y9'],['吉田 ハル','meet','y3'],['吉田 源','speed','y8']],
  pit:[['吉田 山','fast','y6',5,2],['吉田 ナース','curve','y9',3,4]]},
 taka:{key:'taka',name:'秘密結社チーム',short:'結社',col:'#c8282d',mine:true,desc:'足とくせ球。ちょこまか攻める',
  line:[['リーダー','speed','g:リ'],['参謀','meet','g:参'],['ボス','power','g:ボ'],['博士','power','g:博'],['ヒーロー','power','g:ヒ'],['超能力くん','meet','g:超'],['戦闘員A','speed','g:A'],['戦闘員B','normal','g:B'],['戦闘員C','speed','g:C']],
  pit:[['超能力くん','magic','g:超',3,3],['博士','curve','g:博',3,4]]},
 mars:{key:'mars',name:'火星代表',short:'火星',col:'#d94a40',desc:'消える魔球の名手',
  line:[['火星1番','speed','mars'],['火星2番','meet','mars'],['火星3番','power','mars'],['火星4番','power','mars'],['火星5番','normal','mars'],['火星6番','meet','mars'],['火星7番','normal','mars'],['火星8番','normal','mars'],['火星9番','speed','mars']],
  pit:[['魔球のマルス','magic','mars',4,3]]},
 jupiter:{key:'jupiter',name:'木星代表',short:'木星',col:'#c27b2f',desc:'マッハ3の剛速球と大砲',
  line:[['木星1番','meet','jupiter'],['木星2番','normal','jupiter'],['木星3番','power','jupiter'],['木星4番','power','jupiter'],['木星5番','power','jupiter'],['木星6番','normal','jupiter'],['木星7番','meet','jupiter'],['木星8番','normal','jupiter'],['木星9番','normal','jupiter']],
  pit:[['マッハ大赤斑','fast','jupiter',5,2]]},
 venus:{key:'venus',name:'金星代表',short:'金星',col:'#8e5bb0',desc:'腕8本のくねくね球と俊足',
  line:[['金星1番','speed','venus'],['金星2番','speed','venus'],['金星3番','meet','venus'],['金星4番','meet','venus'],['金星5番','power','venus'],['金星6番','normal','venus'],['金星7番','speed','venus'],['金星8番','normal','venus'],['金星9番','normal','venus']],
  pit:[['八本腕','curve','venus',3,5]]}
};
// ---------------- 盤面（野球盤） ----------------
// 座標＝本塁(0,0)・センター方向が+y
const ZONE=3.0, REACH=4.6, BR=0.75, SLOT_Y=-3.9; /* BR＝鉄球の半径（線をかすればストライク） */ const MAG_Y=4.5; const MOUND_Y=10.5, FENCE=60, PLATE_Y=0.4, SWEET=0.06, WIN=0.12;
const TUNE={winHuman:0.17,humanSlow:0.85,cpuVsHuman:0.03,zoomCam:1.85,kankyu:0.3,zoom:2.3,spread:10,earthEye:-0.045,v0:24,v1:46,rOut:2.8,rHit:1.9,inf:24,dec:24}; window.TUNE=TUNE;
const POCKETS=[
 {x:12.5,y:16,k:'out',nm:'一塁',v:40},{x:6.5,y:25,k:'out',nm:'二塁',v:40},{x:-6.5,y:25,k:'out',nm:'遊撃',v:40},{x:-12.5,y:16,k:'out',nm:'三塁',v:40},{x:0,y:13.6,k:'out',nm:'投手',v:30},
 {x:-27,y:36,k:'out',nm:'左翼',v:34},{x:-14,y:42,k:'out',nm:'左中間',v:34},{x:0,y:44,k:'out',nm:'中堅',v:34},{x:14,y:42,k:'out',nm:'右中間',v:34},{x:27,y:36,k:'out',nm:'右翼',v:34},
 {x:-17,y:30,k:'hit',v:36},{x:17,y:30,k:'hit',v:36},{x:0,y:34,k:'hit',v:36},{x:-21,y:46,k:'hit',v:36},{x:21,y:46,k:'hit',v:36},{x:-7,y:47,k:'hit',v:36},{x:7,y:47,k:'hit',v:36},
 {x:-14,y:55,k:'2b',v:38},{x:14,y:55,k:'2b',v:38},{x:0,y:56,k:'out',nm:'中堅（フェンス際）',v:30},
 {x:-37,y:40,k:'3b',v:40},{x:37,y:40,k:'3b',v:40}
];
// 守備の人形を立てる位置（穴の少し後ろ）
const FIELDERS=[[12.5,19.4],[6.5,28.4],[-6.5,28.4],[-12.5,19.4],[-27,39.4],[0,47.4],[27,39.4]];

// ---------------- 状態 ----------------
let G=null; window.G=null;
let MYTEAM='mlb', ORDER=[0,1,2,3,4,5,6,7,8], PIT=0, OPPKEY='taka', MYSIDE='home';
try{const s=JSON.parse(localStorage.getItem('ykb_v4')||'null'); if(s&&TEAMS[s.t]&&TEAMS[s.o]&&s.r&&s.r.length===9){MYTEAM=s.t;ORDER=s.r;PIT=s.p||0;OPPKEY=s.o;}}catch(e){}
function saveLineup(){try{localStorage.setItem('ykb_v4',JSON.stringify({t:MYTEAM,r:ORDER,p:PIT,o:OPPKEY}));}catch(e){}}
function mkTeam(key,mine){
 const T=TEAMS[key], ord=mine?ORDER:[0,1,2,3,4,5,6,7,8];
 const line=ord.map((i,k)=>{const [n,t,im]=T.line[i]; const B=BTYPE[t]; const c2=(CAND2[key]||[])[i]; return {n,bt:t,cands:c2?[t,c2]:[t],rev:!c2,m:B.m,p:B.p,s:B.s,img:im,num:mine?null:k+1,ab:0,h:0,rbi:0};});
 const pp=T.pit[mine?Math.min(PIT,T.pit.length-1):0];
 const pc=(PCAND[key]||[])[T.pit.indexOf(pp)]||[pp[1]];
 const pit={n:pp[0],pt:pc[0],cands:pc,img:pp[2],spd:pp[3],brk:pp[4],magic:pc.includes('magic')?5:2,vanishY:pc.includes('magic')?1.5:2.8,mach:pc.includes('fast'),arms:key==='venus',sta:1,stMax:mine?70:99};
 return {key,name:T.name,short:T.short,col:T.col,line,idx:0,pit,magic:pit.magic};
}
function newGame(mode){
 G={mode,phase:'ready',t:0,timer:0.6,inning:1,top:true,outs:0,b:0,s:0,bases:[null,null,null],
  score:{away:[0,0,0],home:[0,0,0]},T:MYSIDE==='home'?{away:mkTeam(OPPKEY,false),home:mkTeam(MYTEAM,true)}:{away:mkTeam(MYTEAM,true),home:mkTeam(OPPKEY,false)},mine:MYSIDE,landing:null,banner:null,
  pitch:null,ball:null,swing:null,bunt:false,msg:'',msgT:0,log:[],
  sel:{spd:2,brk:0,course:2,magic:false},spd:mode==='auto'?2.5:1,
  st:{sw:0,ct:0,just:0,magicSeen:0,magicHeld:0,K:0,eyeOK:0,eyeNG:0},over:false,cpuSwingAt:null,lastTiming:null,flash:0};
 window.G=G;
 log(`プレイボール！ ${G.T.away.name} vs ${G.T.home.name}`); announce();
 if(mode==='manual'){ say('プレイボール！',1.8); G.timer=humanBats()?2.6:1.6; }
}
const bat=()=>G.top?G.T.away:G.T.home;
const fld=()=>G.top?G.T.home:G.T.away;
const earthBatting=()=>G.top?G.mine==='away':G.mine==='home'; // 自分のチームが攻撃中か
const myT=()=>G.T[G.mine], opT=()=>G.T[G.mine==='home'?'away':'home'];
const curBatter=()=>{const t=bat();return t.line[t.idx%9]};
const curPitcher=()=>fld().pit;
const humanBats=()=>G.mode!=='auto'&&earthBatting();
const humanPitches=()=>G.mode!=='auto'&&!earthBatting();
// 打者が替わるたびに盤面が変わる（ざっくり3通り）
function mods(vis){
 const b=G&&G.T?curBatter():null, t=b?((vis&&!b.rev)?'normal':b.bt):'normal';
 return {outR:t==='meet'?TUNE.rOut*0.5:TUNE.rOut, hrAng:t==='power'?45:30, hrV:t==='power'?4:14, inf:t==='speed'?12:TUNE.inf, t};
}
// 打席・投手の紹介（大きく出す）
function announce(){
 const b=curBatter(), B=BTYPE[b.bt], p=curPitcher(), Pt=PTYPE[p.pt];
 if(b.cands.length>1){b.bt=pick(b.cands);b.rev=false;} else {b.bt=b.cands[0];b.rev=true;}
 G.banner={t:1.3, top:`${b.n}`, bt:b.bt, cands:b.cands, rev:b.rev, pt:p.pt, pn:p.n};
}
function log(s){G.log.unshift(s);if(G.log.length>40)G.log.pop();}
function say(s,t=1.0){G.msg=s;G.msgT=t;}
function inningLabel(){return `${G.inning}回${G.top?'表':'裏'}`;}

// ---------------- 投球（レバー・速さつまみ・変化つまみ・魔球レバー） ----------------
// 変化の幅：段数（-2〜+2）×1段の幅。1段≒コース1マスぶん（変化球の得意な投手ほど少し大きい）
function brkShift(pt,lv){return lv*(1.15+pt.brk*0.12)*(pt.pt==='curve'?1.7:1);} // くねくねは曲がりも大きい
function pitchParams(pt,spdLv,brk,course,magic,aimX){
 // aim＝投げ出す向き（本塁で届くはずの位置）。曲がる球は本塁の手前で shift だけ横にずれる
 const aim0=aimX!==undefined?aimX:[-(ZONE+1.6),-1.8,0,1.8,ZONE+1.6][course];
 let v=magic?30:[15,26+pt.spd,44+pt.spd*4][spdLv];
 if(pt.pt==='fast'&&spdLv>=1&&!magic)v*=1.18; v=Math.min(v,66); // 剛速球（速すぎると誰も打てないので上限）
 const fat=1-pt.sta;
 const aim=aim0+gauss()*(0.22+fat*0.7);
 const rx=pt.arms?pick([-3,-2,-1,1,2,3]):0;
 const shift=magic?0:brkShift(pt,brk);
 return {type:magic?'magic':(brk?'curve':spdLv===0?'slow':'fast'),v,aim,tx:aim+shift,rx,shift,vanishY:pt.vanishY||2.8};
}
function startPitch(pp){
 const T=10.5/pp.v, tc=(MAG_Y-PLATE_Y)/pp.v;
 const acc=pp.shift?2*pp.shift/(tc*tc):0;
 const vx=(pp.aim-pp.rx)/T; // 狙った方へまっすぐ投げ出す
 G.pitch=pp;
 G.ball={x:pp.rx,y:MOUND_Y,vx,vy:-pp.v,ax:acc,inplay:false,vanished:false,crossT:null,done:false,trail:[]};
 G.phase='pitch';G.t=0;G.swing=null;G.cpuSwingAt=null;G.landing=null;
 const p=curPitcher(); p.sta=Math.max(0,p.sta-1/p.stMax);
 if(pp.type==='magic')fld().magic--;
 G.bunt=false;
 if(!humanBats())planCpuSwing(pp);
 { const tc=(MOUND_Y-PLATE_Y)/pp.v; G.expT=(G.expT||0.35)*0.4+tc*0.6; G.lastSpd=pp.type==='slow'?0:pp.v>40?2:1; }
}
function planCpuSwing(pp){
 const b=curBatter(); const zone=Math.abs(pp.tx)<=ZONE+BR;
 let pSw=zone?0.8:0.12+0.05*(5-b.m)+(humanPitches()?0.15:0); // 人が投げるときはボール球に手を出しやすく if(G.b===3&&!zone)pSw=0.15; if(G.s===2)pSw=zone?0.92:0.45;
 if(pp.type==='magic'){const hold=curPitcher().pt==='magic'?0.38:0.5; if(R()<hold)return;}
 if(R()>pSw)return;
 let sig=0.074-0.009*b.m; if(pp.v>29)sig+=0.012*(pp.v-29)/8; if(pp.rx)sig+=0.015; if(pp.shift)sig+=0.006*Math.abs(pp.shift); if(curPitcher().pt==='curve')sig+=0.012;
 if(earthBatting())sig-=TUNE.earthEye; // オートの勝率を5割前後に寄せる補正
 if(humanPitches())sig+=TUNE.cpuVsHuman; // 人が投げるときはCPUの打者を少し打ちにくく
 const tCross=(MOUND_Y-PLATE_Y)/pp.v;
 const expT=G.expT||0.35; // 目が慣れている到達時間
 G.cpuSwingAt=tCross-SWEET+(expT-tCross)*TUNE.kankyu*(b.eye?0.6:1)+gauss()*sig;
}
function cpuPitch(){
 const t=fld(),pt=t.pit; if(pt.cands&&pt.cands.length>1)pt.pt=pick(pt.cands);
 const mz=t.magic>0&&(G.s===2||G.bases[1]||G.bases[2])&&R()<(pt.pt==='magic'?0.4:0.12);
 if(mz)return pitchParams(pt,1,0,2,true);
 const last=G.lastSpd; const spdLv=last===2?pick([0,0,2,1]):last===0?pick([2,2,1,0]):(pt.mach?pick([2,2,0]):pick([0,1,2,2]));
 const brk=pt.pt==='curve'?pick([-2,2,-1,1,-2,2]):pt.brk>=5?pick([-2,2,-2,2,-1,1]):pt.brk>=4?pick([-2,-1,1,2,0,-2,2]):pick([0,0,-1,1,-2,2]);
 let F=pick([-1.8,0,1.8,-1.8,1.8]);
 if(G.b<3&&R()<0.4){const sd=R()<0.5?-1:1; F=sd*(R()<0.5?ZONE+BR+0.15+R()*0.5:ZONE+BR+0.9+R()*1.2);} // ボール球（半分はきわどい）
 const shift=brkShift(pt,brk);
 const pp=pitchParams(pt,spdLv,brk,2,false,F-shift); if(humanBats())pp.v*=TUNE.humanSlow; // 人が打つときは少し遅く
 return pp;
}

// ---------------- 打撃（バネのバット） ----------------
function doSwing(){
 if(G.phase!=='pitch'||G.swing)return;
 G.swing={t:G.t,age:0,p0:BAT_REST*(1-(G.ck||0))}; G.dry=null; G.ck=0; G.cock=false;
 if(humanBats())G.st.sw++;
 const b=G.ball;
 if(b.crossT!==null)tryContact((G.t+SWEET)-b.crossT);
}
function tryContact(err){
 const b=G.ball,pp=G.pitch;
 if(b.done)return;
 if(b.vanished){endPitch('swingMiss',{magic:true});return;}
 const Wn=humanBats()?TUNE.winHuman:WIN;
 if(Math.abs(err)>Wn||Math.abs(b.x)>REACH){G.lastTiming=err<0?'早い！':'遅い！';endPitch('swingMiss');return;}
 const bt=curBatter(); const q=1-Math.pow(Math.abs(err)/Wn,1.5);
 const ang=err/WIN*55+b.x*6+gauss()*TUNE.spread;
 const pw=0.5+0.1*bt.p;
 const v=TUNE.v0+TUNE.v1*pw*Math.pow(q,1.5)*(0.7+0.3*clamp(pp.v/29,0.5,1.8));
 G.lastTiming=Math.abs(err)<0.03?'ジャスト！':err<0?'早め（引っぱり）':'遅め（流し）';
 if(humanBats()){G.st.ct++;if(Math.abs(err)<0.03)G.st.just++;}
 launch(ang,v,false);
}
function doBunt(){
 const b=G.ball;
 if(b.vanished){endPitch('swingMiss',{magic:true});return;}
 if(Math.abs(b.x)>ZONE+BR){endPitch('take');return;}
 launch(gauss()*22,9+R()*7,true);
}
function launch(angDeg,v,bunt){
 { const cb=curBatter(); if(!cb.rev){cb.rev=true; if(BTYPE[cb.bt].ic)say(`${BTYPE[cb.bt].lab}発動！`,1.0);} }
 const b=G.ball,a=angDeg*Math.PI/180;
 b.inplay=true;b.bunt=bunt;b.x=0;b.y=0.6;b.vx=Math.sin(a)*v;b.vy=Math.cos(a)*v;b.ax=0;b.trail=[];
 G.phase='inplay'; if(Math.abs(angDeg)>45)b.foul=true;
 G.flash=0.12;
}

// ---------------- 進行 ----------------
function step(dt){
 if(!G||G.over)return;
 dt*=G.spd;
 if(G.swing)G.swing.age=(G.swing.age||0)+dt; if(G.dry){G.dry.age+=dt; if(G.dry.age>0.45)G.dry=null;}
 { const tg=G.cock||(!humanBats()&&['windup','pitch'].includes(G.phase)&&!G.swing&&!G.bunt); G.ck=G.ck||0; G.ck=tg?Math.min(1,G.ck+dt/0.09):Math.max(0,G.ck-dt/0.3); } // バットを引く（構え）／戻す
 if(G.msgT>0)G.msgT-=dt; if(G.flash>0)G.flash-=dt; if(G.banner)G.banner.t-=dt; if(G.landing)G.landing.t-=dt;
 if(G.phase==='ready'){
  G.timer-=dt;
  if(G.timer<=0&&!humanPitches()&&(!humanBats()||G.cock||G.buntOn||G.timer<-2.0)){const wd=humanBats()?0.95:0.12; const nx=netOn()?netTakePitch():cpuPitch(); if(nx){G.next=nx;G.phase='windup';G.timer=wd;G.windT=wd;}}
 } else if(G.phase==='windup'){
  G.timer-=dt; if(G.timer<=0){startPitch(G.next); if(humanBats())G.bunt=!!G.buntOn;}
 } else if(G.phase==='pitch'){
  G.t+=dt; const b=G.ball;
  b.trail.push([b.x+(b.wob||0),b.y]); if(b.trail.length>(curPitcher().pt==='fast'?12:curPitcher().pt==='curve'?16:7))b.trail.shift();
  b.vx+=(b.y<MAG_Y&&b.y>PLATE_Y?b.ax:0)*dt; b.x+=b.vx*dt; b.y+=b.vy*dt;
  if(curPitcher().pt==='curve'){const k=(MOUND_Y-b.y); b.wob=2.4*Math.sin(k*1.1)*clamp((b.y-1.2)/4,0,1);} else b.wob=0;
  if(!b.vanished&&G.pitch.type==='magic'&&b.y<G.pitch.vanishY)b.vanished=true;
  if(G.cpuSwingAt!==null&&G.t>=G.cpuSwingAt){G.cpuSwingAt=null;doSwing();}
  if(b.crossT===null&&b.y<=PLATE_Y){
   b.crossT=G.t; b.crossX=b.x; b.vx=0; b.ax=0;
   if(G.bunt){doBunt();return;}
   if(G.swing){tryContact((G.swing.t+SWEET)-b.crossT);if(G.phase!=='pitch')return;}
  }
  if(b.crossT!==null&&b.y<=SLOT_Y&&!b.done){
   if(G.swing&&!b.inplay){endPitch('swingMiss');return;}
   if(!G.swing){endPitch('take');return;}
  }
 } else if(G.phase==='inplay'){
  rollBall(dt*1.8);
 } else if(G.phase==='result'){
  G.timer-=dt; if(G.judge)G.judge.t-=dt; if(G.timer<=0)afterResult();
 }
}
window.step=step;

function rollBall(dt){
 const b=G.ball; const sp=Math.hypot(b.vx,b.vy);
 b.trail.push([b.x,b.y]); if(b.trail.length>10)b.trail.shift();
 if(b.foul&&Math.hypot(b.x,b.y)>8){endPitch('foul');return;}
 const ns=Math.max(0,sp-TUNE.dec*dt); if(sp>0){b.vx*=ns/sp;b.vy*=ns/sp;}
 b.x+=b.vx*dt;b.y+=b.vy*dt;
 const r=Math.hypot(b.x,b.y), ang=Math.atan2(b.x,b.y)*180/Math.PI;
 if(!b.foul){
  const M=mods();
  for(const p of POCKETS){ if(Math.hypot(b.x-p.x,b.y-p.y)<(p.k==='out'?M.outR:TUNE.rHit)&&ns<p.v){ b.x=p.x;b.y=p.y; b.inPocket=true; return resolveInPlay(p.k,p); } }
  if(r>=FENCE){
   if(Math.abs(ang)<=M.hrAng+1&&ns>=M.hrV)return resolveInPlay('hr');
   const nx=b.x/r,ny=b.y/r; b.x=nx*(FENCE-0.3);b.y=ny*(FENCE-0.3); b.wall=true; return resolveInPlay('2b'); // フェンス直撃＝ツーベース
  }
  if(Math.abs(ang)>47&&r>3){ if(r<22)return endPitch('foul'); return resolveInPlay(r>40?'2b':'hit'); }
 }
 if(ns<0.6){ if(r<mods().inf){ if(!b.bunt&&mods().t==='speed'&&r>9&&R()<0.5){G.infHit=true;return resolveInPlay('hit');} return resolveInPlay('ground'); } return resolveInPlay(r>=44?'2b':'hit'); }
}

function endPitch(kind,opt={}){
 const b=G.ball; b.done=true; let txt='';
 if(G.pitch&&G.pitch.type==='magic'&&earthBatting()){G.st.magicSeen++; if(kind==='take')G.st.magicHeld++;}
 if(kind==='take'){
  const cx=b.crossX!==undefined?b.crossX:G.pitch.tx;
  const strike=!b.vanished&&Math.abs(cx)<=ZONE+BR;
  G.judge={slot:strike?'S':'B',x:cx,t:0.9,edge:strike&&Math.abs(cx)>ZONE-BR};
  if(b.vanished){txt='消える魔球を見送った！ボール';G.judge.slot='B';addBall();}
  else if(strike){txt=G.judge.edge?'かすった！ストライク':'見逃し ストライク';if(earthBatting())G.st.eyeNG++;addStrike();}
  else{txt=earthBatting()?'ボール！ナイス見極め':'ボール';if(earthBatting())G.st.eyeOK++;addBall();}
 } else if(kind==='swingMiss'){ const bad=!opt.magic&&Math.abs(b.crossX!==undefined?b.crossX:G.pitch.tx)>ZONE+BR; txt=opt.magic?'消える魔球！空振り！':bad?'ボール球に手を出した！':'空振り！'; if(bad&&earthBatting())G.st.eyeNG++; addStrike(); }
 else if(kind==='foul'){ txt='ファウル'; if(G.s<2)G.s++; }
 say(txt,0.6); if(kind!=='foul')log(`${inningLabel()} ${curBatter().n}：${txt}`);
 G.phase='result';G.timer=0.35;
}
function addBall(){G.b++; if(G.b>=4)walk();}
function addStrike(){G.s++; if(G.s>=3)strikeout();}
function strikeout(){ const bt=curBatter();bt.ab++; if(!earthBatting())G.st.K++; out(1,`${bt.n} 三振！`); nextBatter(); }
function walk(){ const bt=curBatter(); force(bt); log(`${inningLabel()} ${bt.n}：フォアボール`); say('フォアボール',0.8); nextBatter(); }
function force(bt){ const B=G.bases; if(B[0]){ if(B[1]){ if(B[2])score(1); B[2]=B[1]; } B[1]=B[0]; } B[0]=bt; }
function score(n){ const k=G.top?'away':'home'; G.score[k][G.inning-1]+=n; }
function out(n,txt){ G.outs+=n; if(txt){log(`${inningLabel()} ${txt}`);say(txt.replace(/^.*? /,''),0.9);} }
function nextBatter(){ bat().idx++; G.b=0;G.s=0; G.expT=null; G.needAnnounce=true; }

function resolveInPlay(k,p){
 const b=G.ball,bt=curBatter(),B=G.bases; b.done=true;
 let txt=''; const pos=p&&p.nm?p.nm:'';
 if(b.bunt){
  bt.ab++;
  if(k==='hit'||k==='2b'){ advance(1,bt);txt='セーフティバント！';bt.h++; }
  else if(B.some(x=>x)&&R()<0.28){ const i=B[2]?2:B[1]?1:0; B[i]=null; out(1); if(!B[0])B[0]=bt; txt='バント失敗（先の走者が封殺）'; }
  else{ const had=B.some(x=>x); if(B[2]&&G.outs<2&&R()<0.4){score(1);B[2]=null;} if(B[1]){B[2]=B[1];B[1]=null;} if(B[0]){B[1]=B[0];B[0]=null;} out(1); txt=had?'送りバント成功':'バント…アウト'; }
 } else if(k==='hr'){ bt.ab++;bt.h++; const n=1+B.filter(x=>x).length; B[0]=B[1]=B[2]=null; score(n); bt.rbi+=n; txt=n>1?`ホームラン！${n}点！`:'ホームラン！'; }
 else if(k==='3b'){ bt.ab++;bt.h++; const n=B.filter(x=>x).length; B[0]=B[1]=null;B[2]=bt; score(n); bt.rbi+=n; txt='スリーベース！'; }
 else if(k==='2b'){ bt.ab++;bt.h++; let n=0; if(B[2])n++; if(B[1])n++; const r1=B[0]; B[2]=null;B[1]=bt;B[0]=null; if(r1){ if(R()<0.35+0.08*r1.s)n++; else B[2]=r1; } score(n); bt.rbi+=n; txt=(b.wall?'フェンス直撃！ツーベース':'ツーベース！')+(n?` ${n}点`:''); }
 else if(k==='hit'){ bt.ab++;bt.h++; let n=0; if(B[2]){n++;B[2]=null;} if(B[1]){ if(R()<0.5+0.08*B[1].s)n++; else B[2]=B[1]; B[1]=null;} if(B[0]){ if(B[0].s>=5&&!B[2]&&R()<0.5)B[2]=B[0]; else B[1]=B[0]; B[0]=null;} B[0]=bt; score(n); bt.rbi+=n; txt=(G.infHit?'俊足！内野安打':'ヒット！')+(n?` ${n}点`:''); G.infHit=false; }
 else {
  bt.ab++;
  const of=p&&/翼|中堅|中間/.test(p.nm);
  if(of){ txt=`${pos}フライ`; out(1); if(B[2]&&G.outs<3&&R()<0.55){score(1);B[2]=null;txt+='（犠牲フライ）';bt.rbi++;} }
  else if(B[0]&&G.outs<2&&R()<0.45){ out(2); B[0]=null; if(B[1]&&!B[2]){B[2]=B[1];B[1]=null;} txt=`${pos||'内野'}ゴロ ゲッツー！`; }
  else { out(1); txt=`${pos||'内野'}ゴロ`; }
 }
 const tm=humanBats()&&G.lastTiming?`（${G.lastTiming}）`:'';
 log(`${inningLabel()} ${bt.n}：${txt}${tm}`); if(k==='hr')say(txt,1.2);
 G.landing={x:b.x,y:b.y,t:2.2,label:txt.replace(/（.*$/,'').replace(/ \d点.*$/,''),col:k==='hr'?'#ff4d4d':(k==='2b'||k==='3b')?'#ff8a2b':k==='hit'?'#f2c230':'#4f8fe0'};
 nextBatter(); G.phase='result';G.timer=1.4; // 止まった場所が見えるように少し長く
}
function advance(n,bt){ const B=G.bases; let sc=0; for(let i=2;i>=0;i--){ if(B[i]){ if(i+n>=3)sc++; else B[i+n]=B[i]; B[i]=null; } } B[n-1]=bt; score(sc); }

function afterResult(){
 G.lastTiming=null;
 const H=sum(G.score.home),A=sum(G.score.away);
 if(!G.top&&G.inning===3&&H>A)return endGame();
 if(G.outs>=3){
  G.outs=0;G.b=0;G.s=0;G.bases=[null,null,null];
  if(G.top){ if(G.inning===3&&H>A)return endGame(); G.top=false; }
  else { if(G.inning===3)return endGame(); G.inning++;G.top=true; }
  log(`―― ${inningLabel()} ――`); say(`チェンジ　${inningLabel()}　${earthBatting()?'攻撃':'守備'}`,1.4); G.timer=G.mode!=='auto'?2.0:0.6; announce();
 } else G.timer=humanPitches()?0:(humanBats()?(G.needAnnounce?1.9:1.0):0.18); // 打つ番は「間」を取る
 G.phase='ready';G.ball=null; G.swing=null; if(!G.cock)G.ck=0; if(G.needAnnounce&&!G.over){announce();} G.needAnnounce=false;
 renderCtrl();
}
function endGame(){ G.over=true;G.phase='end'; renderCtrl(); renderResult(); }

// ---------------- 入力 ----------------
function humanThrow(){
 if(!G||G.phase!=='ready'||!humanPitches())return;
 if(netOn()){netThrow();return;}
 const t=fld(); const mg=G.sel.magic&&t.magic>0;
 if(t.pit.cands.length>1)t.pit.pt=t.pit.cands.includes(G.sel.ptype)?G.sel.ptype:t.pit.cands[0];
 G.next=pitchParams(t.pit,G.sel.spd,G.sel.brk,G.sel.course,mg);
 G.sel.magic=false;
 G.phase='windup';G.timer=0.15;G.windT=0.15; renderCtrl();
}
function humanSwing(){ if(G&&humanBats()&&!G.bunt&&G.phase==='pitch')doSwing(); }
const BAT_REST=0.75; // 構えていないときのバット（前に出ている）。0＝引き切った構え／1＝振り切り
function cockStart(){ if(G&&!G.over&&humanBats()&&!G.bunt&&!G.buntOn&&!(G.phase==='pitch'&&G.swing))G.cock=true; }
function cockRelease(){ if(!G||!G.cock)return; G.cock=false; humanSwing(); if(!G.swing){G.dry={age:0,p0:BAT_REST*(1-(G.ck||0))}; G.ck=0;} } // 投球の前に離したら、空振りで振り切る（カウントは増えない）

 const cb=curBatter();
 return {hk:hkOf(),f:++NET.frame,ph:G.phase,t:+G.t.toFixed(3),inn:G.inning,top:G.top,o:G.outs,b:G.b,s:G.s,bs:G.bases.map(bi),
  sc:{a:G.score.away,h:G.score.home},ix:{a:G.T.away.idx,h:G.T.home.idx},mg:{a:G.T.away.magic,h:G.T.home.magic},sta:{a:+G.T.away.pit.sta.toFixed(3),h:+G.T.home.pit.sta.toFixed(3)},
  bt:cb.bt,rev:cb.rev,pt:F.pit.pt,
  ball:b?{x:+b.x.toFixed(2),y:+b.y.toFixed(2),ip:b.inplay?1:0,vn:b.vanished?1:0,w:+(b.wob||0).toFixed(2),f:b.foul?1:0}:null,
  pty:G.pitch?G.pitch.type:null,sw:G.swing?{t:+G.swing.t.toFixed(3),p0:+G.swing.p0.toFixed(2),age:+(G.swing.age||0).toFixed(3)}:null,dr:G.dry?{p0:+G.dry.p0.toFixed(2),age:+G.dry.age.toFixed(3)}:null,ck:+(G.ck||0).toFixed(2),bu:G.bunt?1:0,
  msg:G.msgT>0?G.msg:'',mt:+Math.max(0,G.msgT).toFixed(2),bn:G.banner&&G.banner.t>0?{t:+G.banner.t.toFixed(2),top:G.banner.top,bt:G.banner.bt,cands:G.banner.cands,rev:G.banner.rev,pt:G.banner.pt,pn:G.banner.pn}:null,
  ld:G.landing&&G.landing.t>0?{x:+G.landing.x.toFixed(1),y:+G.landing.y.toFixed(1),t:+G.landing.t.toFixed(2),label:G.landing.label,col:G.landing.col}:null,
  jd:G.judge&&G.judge.t>0?{slot:G.judge.slot,x:+G.judge.x.toFixed(2),t:+G.judge.t.toFixed(2),edge:G.judge.edge?1:0}:null,
  fl:G.flash>0?+G.flash.toFixed(2):0,lg:G.log.slice(0,8),ov:G.over?1:0,ps:NET.used};
}
// 投げる側：相手から届いた盤面を映す（打つ側に切り替わったら、ここから自分で進める）
function netApply(s){
 if(!G||!s)return;
 if(s.hk<NET.lastHk)return;
 if(humanBats()&&s.hk<=hkOf())return; // 自分が打っている間は、自分が正
 NET.lastHk=s.hk;
 const ph0=G.phase,top0=G.top;
 G.inning=s.inn;G.top=s.top;G.outs=s.o;G.b=s.b;G.s=s.s;
 G.score.away=s.sc.a.slice();G.score.home=s.sc.h.slice();
 G.T.away.idx=s.ix.a;G.T.home.idx=s.ix.h;G.T.away.magic=s.mg.a;G.T.home.magic=s.mg.h;G.T.away.pit.sta=s.sta.a;G.T.home.pit.sta=s.sta.h;
 const B=bat(); G.bases=s.bs.map(i=>i>=0?B.line[i]:null);
 const cb=curBatter(); cb.bt=s.bt; cb.rev=s.rev; fld().pit.pt=s.pt;
 if(s.ball){ if(!G.ball)G.ball={trail:[]}; const o=G.ball; if(s.ph==='pitch'||s.ph==='inplay'){o.trail.push([s.ball.x+(s.ball.w||0),s.ball.y]); if(o.trail.length>10)o.trail.shift();} o.x=s.ball.x;o.y=s.ball.y;o.inplay=!!s.ball.ip;o.vanished=!!s.ball.vn;o.wob=s.ball.w;o.foul=!!s.ball.f; }
 else G.ball=null;
 G.pitch=s.pty?{type:s.pty,tx:0}:null;
 G.phase=s.ph; G.t=s.t; G.swing=s.sw; G.dry=s.dr; G.ck=s.ck; G.bunt=!!s.bu;
 if(s.msg){G.msg=s.msg;G.msgT=s.mt;} else G.msgT=0;
 G.banner=s.bn; G.landing=s.ld; G.judge=s.jd; G.flash=s.fl;
 G.log=s.lg.slice();
 if(s.ps>=NET.pseq)NET.waiting=false;
 if(s.ov&&!G.over){G.over=true;G.phase='end';renderCtrl();renderResult();return;}
 if(G.phase!==ph0||G.top!==top0)renderCtrl();
 if(humanBats()){ // ここから自分が打つ番：自分の端末で進める
  G.ball=null; G.swing=null; G.ck=0; G.cock=false; if(G.phase!=='ready'){G.phase='ready';} G.timer=1.4; NET.used=0; NET.pending=null; renderCtrl();
 }
}
// 投げる側：球を送る
function netThrow(){
 if(!NET.room||NET.waiting)return;
 const t=fld(); const mg=G.sel.magic&&t.magic>0;
 if(t.pit.cands.length>1)t.pit.pt=t.pit.cands.includes(G.sel.ptype)?G.sel.ptype:t.pit.cands[0];
 const pp=pitchParams(t.pit,G.sel.spd,G.sel.brk,G.sel.course,mg);
 G.sel.magic=false;
 NET.pseq++; NET.waiting=true;
 NET.room.presence({p:{seq:NET.pseq,hk:hkOf(),pt:t.pit.pt,pp}});
 say('投げた！',0.8); renderCtrl();
}
// 打つ側：相手の球が届いていたら取り出す
function netTakePitch(){
 const p=NET.pending; if(!p||p.seq<=NET.used||p.hk!==hkOf())return null;
 NET.used=p.seq; NET.pending=null; fld().pit.pt=p.pt; return p.pp;
}
function netTick(){
 if(!netOn()||!NET.room)return;
 const auth=humanBats()&&!G.over;
 // 打っている間は毎フレーム送る。攻守交代・試合終了の直後にも1回だけ送る（相手がそこから引き継ぐ）
 if(auth||NET.wasAuth){ NET.lastHk=Math.max(NET.lastHk,hkOf()); NET.room.presence({s:netSnap()}).catch(()=>{}); }
 NET.wasAuth=auth;
}

// ---------------- ループ ----------------
let lastT=null,sbTick=0;
function frame(ts){ if(lastT===null)lastT=ts; const dt=Math.min(0.05,(ts-lastT)/1000); lastT=ts; tick(dt); requestAnimationFrame(frame); }
function tick(dt){
 if(G&&!G.over&&!(netOn()&&!humanBats())){ const ph=G.phase; step(dt); if(G&&G.phase!==ph&&(G.phase==='ready'||G.phase==='windup'))renderCtrl(); }
 if(G)netTick();
 render(); sbTick+=dt; if(sbTick>0.1){sbTick=0;renderSB();}
}
window.tick=tick;
window.simGames=function(n=20,opp='mars'){
 const agg={runsE:0,runsO:0,hr:0,games:n,wins:0}; const keep=OPPKEY; OPPKEY=opp;
 for(let g=0;g<n;g++){ newGame('auto'); let k=0; while(!G.over&&k<200000){step(0.05);k++;} const e=sum(G.score.home),o=sum(G.score.away); agg.runsE+=e;agg.runsO+=o; if(e>o)agg.wins++; agg.hr+=G.log.filter(s=>s.includes('ホームラン')).length; }
 OPPKEY=keep; return agg;
};
menu();
requestAnimationFrame(frame);
</script>
